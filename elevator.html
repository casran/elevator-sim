<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>엘리베이터 시뮬레이터</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b1d22">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="엘리베이터">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--bg:#1b1d22;--panel:#2a2d34;--metal:#c9ccd2;--accent:#ff9f1c;--text:#f4f4f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none;background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
.app{display:flex;height:100%}
.half{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;min-width:0}
.left{flex-direction:column;gap:14px;background:#14161a}
.display{background:#000;color:var(--accent);font:700 clamp(48px,9vw,96px)/1 "Courier New",monospace;padding:8px 32px;border-radius:12px;border:4px solid var(--metal);min-width:2.2em;text-align:center}
.display small{font-size:.4em;margin-left:4px}
.arrow{height:28px;font-size:24px;color:var(--accent)}
.shaft{position:relative;width:min(100%,360px);aspect-ratio:3/4;border:8px solid var(--metal);border-radius:6px;background:linear-gradient(#f6e9c8,#d9c58f);overflow:hidden}
.in{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;align-items:center;justify-content:center;gap:2px 4px;padding:10px;line-height:1;color:#6b5a2a}
.door{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#aeb2b9,#e3e5e8,#aeb2b9);transition:transform 1s ease;border:1px solid #888}
.door.l{left:0;transform:translateX(-100%)}
.door.r{right:0;transform:translateX(100%)}
.closed .door.l,.closed .door.r{transform:translateX(0)}
.right{background:var(--panel)}
.pad{display:grid;grid-template-columns:repeat(var(--cols,2),1fr);gap:14px;width:min(100%,var(--w,300px))}
.fnrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(100%,300px)}
.btn{aspect-ratio:1;border-radius:50%;border:6px solid var(--metal);background:#3a3e47;color:var(--text);font:700 clamp(28px,5vw,44px) "Noto Sans KR",sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation;transition:transform .08s}
.btn:active{transform:scale(.93)}
.btn.on{background:var(--accent);color:#222;box-shadow:0 0 22px var(--accent)}
.btn.fn{font-size:clamp(18px,3vw,26px)}
.btn img{width:70%;height:70%;object-fit:contain}
.right{flex-direction:column;justify-content:flex-start;gap:12px;overflow-y:auto}
.right::before,.right::after{content:"";flex:1}
.admin-panel{display:flex;align-items:center;gap:14px;font-size:20px;padding:8px 16px;border:2px dashed var(--accent);border-radius:12px}
.admin-panel[hidden]{display:none}
.admin-panel b{font-size:32px;min-width:1.5em;text-align:center;color:var(--accent)}
.btn.mini{width:52px;height:52px;aspect-ratio:auto;font-size:28px;border-width:4px}
.btn.adminbtn{aspect-ratio:auto;border-radius:12px;width:min(100%,300px);height:48px;border-width:3px;font-size:18px;flex-shrink:0}
@media (max-width:560px){.half{padding:8px}.pad{gap:10px}}
</style>
</head>
<body>
<div class="app">
  <div class="half left">
    <div class="arrow" id="arrow"></div>
    <div class="display" id="floor">1<small>F</small></div>
    <div class="shaft closed" id="shaft">
      <div class="in">🧍 🧍‍♀️</div>
      <div class="door l"></div><div class="door r"></div>
    </div>
  </div>
  <div class="half right" id="right">
    <div class="admin-panel" id="adminPanel" hidden>
      <span>최고층</span>
      <button class="btn mini" data-name="minus">−</button>
      <b id="maxVal">4</b>
      <button class="btn mini" data-name="plus">+</button>
    </div>
    <div class="fnrow">
      <button class="btn fn" data-name="close">닫힘</button>
      <button class="btn fn" data-name="open">열림</button>
    </div>
    <div class="pad" id="pad"></div>
    <button class="btn fn adminbtn" id="adminBtn" data-name="admin">관리자</button>
  </div>
</div>
<script>
/* 소리 규칙: sounds/<이름>.mp3 가 있으면 재생, 없으면 아래 텍스트를 읽어줌.
   버튼을 이미지로 바꾸려면 버튼 안에 <img src="이름.png">를 넣으면 됩니다. */
const SOUND_DIR = "sounds/";
const TEXT = {close:"닫힘", open:"열림", "door-open":"문이 열립니다", "going-up":"올라갑니다", "going-down":"내려갑니다", arrived:"도착했습니다. 문이 열립니다", admin:"관리자", "admin-off":"관리자 종료"};
for (let n=1;n<=20;n++){ TEXT[n]=n+"층"; TEXT[n+"-cancel"]=n+"층 취소"; TEXT["arrive-"+n]=n+"층입니다"; TEXT["max-"+n]="최고층 "+n+"층"; }

let pid=0;
function play(name, onEnd0){
  const my=++pid;
  const onEnd=()=>{ if(my===pid && onEnd0) onEnd0(); };
  try{ speechSynthesis.cancel(); }catch(e){}
  let done=false;
  const fallback=()=>{
    if(done) return; done=true;
    if(!("speechSynthesis" in window)){ onEnd&&onEnd(); return; }
    const u=new SpeechSynthesisUtterance(TEXT[name]||String(name));
    u.lang="ko-KR";
    u.onend=()=>onEnd&&onEnd();
    u.onerror=()=>onEnd&&onEnd();
    speechSynthesis.speak(u);
  };
  try{
    const a=new Audio(SOUND_DIR+name+".mp3");
    a.onerror=fallback;
    a.onended=()=>{ if(!done){ done=true; onEnd&&onEnd(); } };
    a.play().catch(fallback);
  }catch(e){ fallback(); }
}

const st={floor:1,dir:1,max:12,admin:false,selected:new Set(),open:true,moving:false,closing:false,autoTimer:null,moveTimer:null};
const $floor=document.getElementById("floor"), $shaft=document.getElementById("shaft"), $arrow=document.getElementById("arrow");

const $crowd=document.querySelector(".in");
const PEOPLE=["\u{1F9CD}","\u{1F9CD}\u200D\u2640\uFE0F","\u{1F9CD}\u200D\u2642\uFE0F"];
let wasOpen=false;
function newCrowd(){
  const n=1+Math.floor(Math.random()*20);
  $crowd.style.fontSize=(n<=4?72:n<=8?56:n<=12?48:40)+"px";
  let s="";
  for(let i=0;i<n;i++) s+="<span>"+PEOPLE[Math.floor(Math.random()*PEOPLE.length)]+"</span>";
  $crowd.innerHTML=s;
}

function render(){
  if(st.open && !wasOpen) newCrowd();
  wasOpen=st.open;
  $floor.firstChild.textContent=st.floor;
  $shaft.classList.toggle("closed",!st.open);
  $arrow.textContent=st.moving?(st.dir>0?"▲":"▼"):"";
  document.getElementById("adminBtn").classList.toggle("on",st.admin);
  document.getElementById("adminPanel").hidden=!st.admin;
  document.getElementById("maxVal").textContent=st.max;
  document.querySelectorAll(".btn[data-name]").forEach(b=>{
    const n=+b.dataset.name;
    if(n) b.classList.toggle("on",st.selected.has(n));
  });
}

function scheduleAutoClose(){
  clearTimeout(st.autoTimer);
  if(st.open && !st.moving && !st.admin && st.selected.size>0){
    st.autoTimer=setTimeout(closeDoor,3000);
  }
}

function closeDoor(){
  clearTimeout(st.autoTimer);
  if(st.moving||st.closing||!st.open) return;
  st.admin=false;
  st.selected.delete(st.floor); // 현재 층 선택은 무시
  render();
  if(st.selected.size===0) return; // 갈 곳이 없으면 열어 둔다
  st.closing=true; st.open=false; render();
  setTimeout(()=>{ st.closing=false; startMoving(); },1000);
}

function pickDir(){
  const t=[...st.selected];
  const up=t.some(x=>x>st.floor), down=t.some(x=>x<st.floor);
  if(st.dir>0 && !up && down) st.dir=-1;
  else if(st.dir<0 && !down && up) st.dir=1;
}

function startMoving(){
  if(st.selected.size===0){ st.open=true; render(); return; }
  st.moving=true; pickDir(); render();
  play(st.dir>0?"going-up":"going-down");
  st.moveTimer=setInterval(()=>{
    pickDir();
    st.floor+=st.dir;
    if(st.selected.has(st.floor)){
      clearInterval(st.moveTimer); st.moving=false;
      st.selected.delete(st.floor);
      st.open=true; render();
      play("arrive-"+st.floor,()=>play("door-open",scheduleAutoClose));
      return;
    }
    render();
  },1000);
}

function openDoor(){
  if(st.moving||st.closing) return;
  if(!st.open){ st.open=true; render(); }
  scheduleAutoClose();
}

document.getElementById("right").addEventListener("click",e=>{
  const b=e.target.closest(".btn"); if(!b) return;
  const name=b.dataset.name;
  if(name==="admin"){ toggleAdmin(); }
  else if(name==="minus"||name==="plus"){ changeMax(name==="plus"?1:-1); }
  else if(name==="close"){ play("close"); closeDoor(); }
  else if(name==="open"){ play("open"); openDoor(); }
  else{
    const n=+name;
    if(st.selected.has(n)){ st.selected.delete(n); play(n+"-cancel"); }
    else{ st.selected.add(n); play(String(n)); }
    render();
    scheduleAutoClose();
  }
});

function buildPad(){
  const pad=document.getElementById("pad");
  const cols=st.max<=4?2:(st.max<=12?3:4);
  pad.style.setProperty("--cols",cols);
  pad.style.setProperty("--w",(cols===2?300:cols*112)+"px");
  pad.innerHTML="";
  for(let n=st.max;n>=1;n--){
    const b=document.createElement("button");
    b.className="btn"; b.dataset.name=n; b.textContent=n;
    pad.appendChild(b);
  }
  render();
}

function toggleAdmin(){
  if(st.moving||st.closing) return;
  st.admin=!st.admin;
  play(st.admin?"admin":"admin-off");
  if(st.admin) clearTimeout(st.autoTimer); else scheduleAutoClose();
  render();
}

function changeMax(d){
  if(!st.admin||st.moving||st.closing) return;
  const m=Math.min(20,Math.max(4,st.max+d));
  if(m===st.max){ play("max-"+m); return; }
  st.max=m;
  [...st.selected].forEach(x=>{ if(x>m) st.selected.delete(x); });
  if(st.floor>m) st.floor=m;
  play("max-"+m);
  buildPad();
}

buildPad();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js").catch(() => {}));
}
</script>
</body>
</html>
